<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="mt md">
  <title id="mt">Elton Sakyi</title>
  <desc id="md">I build the parts of software that have to be right later. A chain of linked records runs beneath the name, each entry carrying the fingerprint of the one before it.</desc>

  <rect width="1000" height="300" fill="#F4F1EA"/>

  <!-- top rule + folio -->
  <g font-family="'SF Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" letter-spacing="3" fill="#6B655C">
    <text x="60" y="46">O N   T H E   R E C O R D</text>
  </g>
  <line x1="60" y1="62" x2="940" y2="62" stroke="#111417" stroke-width="1.6"/>

  <!-- name -->
  <text x="60" y="150" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif"
        font-size="76" fill="#111417" letter-spacing="-1.4">Elton Sakyi</text>

  <!-- thesis -->
  <text x="62" y="196" font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif"
        font-size="23" font-style="italic" fill="#2E2A24">I build the parts of software that have to be right later.</text>

  <!-- the chain: each record links to the one before it -->
  <g transform="translate(60,238)">
    <line x1="0" y1="14" x2="880" y2="14" stroke="#CFC7B7" stroke-width="1"/>
    <g fill="none" stroke="#8A8275" stroke-width="1.4">
      <rect x="0"   y="6" width="16" height="16" rx="2"/>
      <rect x="56"  y="6" width="16" height="16" rx="2"/>
      <rect x="112" y="6" width="16" height="16" rx="2"/>
      <rect x="168" y="6" width="16" height="16" rx="2"/>
      <rect x="224" y="6" width="16" height="16" rx="2"/>
      <rect x="280" y="6" width="16" height="16" rx="2"/>
      <rect x="336" y="6" width="16" height="16" rx="2"/>
      <rect x="392" y="6" width="16" height="16" rx="2"/>
      <rect x="448" y="6" width="16" height="16" rx="2"/>
      <rect x="504" y="6" width="16" height="16" rx="2"/>
      <rect x="560" y="6" width="16" height="16" rx="2"/>
      <rect x="616" y="6" width="16" height="16" rx="2"/>
      <rect x="672" y="6" width="16" height="16" rx="2"/>
      <rect x="728" y="6" width="16" height="16" rx="2"/>
    </g>
    <!-- the link: a fingerprint carried forward from each block to the next -->
    <g stroke="#276671" stroke-width="1.4" fill="none" opacity="0.85">
      <path d="M16 14 h40"/><path d="M128 14 h40"/><path d="M240 14 h40"/>
      <path d="M352 14 h40"/><path d="M464 14 h40"/><path d="M576 14 h40"/>
      <path d="M688 14 h40"/>
    </g>
    <!-- newest entry, sealed -->
    <rect x="784" y="6" width="16" height="16" rx="2" fill="#276671" stroke="#276671" stroke-width="1.4"/>
    <text x="812" y="19" font-family="'SF Mono','SFMono-Regular',Consolas,Menlo,monospace"
          font-size="11" letter-spacing="1.4" fill="#6B655C">NOW</text>
  </g>
</svg>
