<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="mt md">
  <title id="mt">Elton Sakyi</title>
  <desc id="md">I build software that keeps its word. Beneath the line, a trace runs through a series of checkpoints. At one point it lifts away to a correction and returns, and the original segment is still drawn underneath it.</desc>

  <rect width="1000" height="340" fill="#0F1214"/>

  <!-- signature -->
  <text x="72" y="62" font-family="'SF Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
        font-size="13" letter-spacing="4.5" fill="#F4F1EA" xml:space="preserve">ELTON SAKYI</text>
  <line x1="72" y1="79" x2="212" y2="79" stroke="#F4F1EA" stroke-width="1.5"/>

  <!-- thesis -->
  <g font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif" font-size="60" fill="#F4F1EA" letter-spacing="-1">
    <text x="70" y="180">I build software</text>
    <text x="70" y="244">that keeps its word.</text>
  </g>

  <!-- the trace: checkpoints on a line, one correction that leaves the original in place -->
  <g>
    <!-- baseline segments -->
    <g stroke="#7E888D" stroke-width="1.5">
      <path d="M84 296 H190"/><path d="M202 296 H308"/><path d="M320 296 H426"/><path d="M438 296 H544"/>
      <path d="M674 296 H780"/><path d="M792 296 H898"/>
    </g>
    <!-- the original segment, still drawn beneath the correction -->
    <path d="M556 296 H662" stroke="#586268" stroke-width="1.6"/>
    <!-- the correction: it departs, is recorded, and rejoins -->
    <path d="M556 296 L598 256" stroke="#F4F1EA" stroke-width="1.6" fill="none"/>
    <path d="M608 256 L662 296" stroke="#F4F1EA" stroke-width="1.6" fill="none"/>
    <rect x="598" y="251" width="10" height="10" fill="#D8A14A"/>
    <!-- checkpoints -->
    <g fill="none" stroke="#7E888D" stroke-width="1.5">
      <rect x="72"  y="290" width="12" height="12"/>
      <rect x="190" y="290" width="12" height="12"/>
      <rect x="308" y="290" width="12" height="12"/>
      <rect x="426" y="290" width="12" height="12"/>
      <rect x="544" y="290" width="12" height="12"/>
      <rect x="662" y="290" width="12" height="12"/>
      <rect x="780" y="290" width="12" height="12"/>
    </g>
    <!-- newest entry, sealed -->
    <rect x="898" y="290" width="12" height="12" fill="#78C4CF"/>
  </g>
</svg>
