<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="mt md">
  <title id="mt">Elton Sakyi</title>
  <desc id="md">I build software that keeps its word.</desc>

  <rect width="1000" height="300" fill="#F4F1EA"/>

  <!-- signature -->
  <text x="72" y="58" font-family="'SF Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
        font-size="13" letter-spacing="4.5" fill="#111417" xml:space="preserve">ELTON SAKYI</text>
  <line x1="72" y1="75" x2="212" y2="75" stroke="#111417" stroke-width="1.5"/>

  <!-- thesis -->
  <g font-family="Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif" font-size="60" fill="#111417" letter-spacing="-1">
    <text x="70" y="172">I build software</text>
    <text x="70" y="236">that keeps its word.</text>
  </g>
</svg>
